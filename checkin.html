<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>GPS Check In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">

<h2>📍 GPS CHECK IN</h2>
<p id="status">Belum mengambil lokasi</p>
<label>Pilih Outlet</label>

</select>

<br><br>
<button onclick="ambilLokasi()">

</button>

<h3>Hasil Check In</h3>

<p><b>Longitude:</b> <span id="lng">-</span></p>

<p><b>Waktu:</b> <span id="waktu">-</span></p>
<br><br>

<button onclick="location.href='dashboard.html'">
⬅ Kembali
</button>

</div>

<script src="js/checkin.js"></script>

</html>
